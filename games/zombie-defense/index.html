<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zombie Defense</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;    /* no scrollbars - the game fills the window */
      font-family: sans-serif;
      background: #87CEEB; /* sky blue */
    }

    /* The bar across the top of the screen */
    #top-bar {
      text-align: center;
      padding: 5px;
    }

    /* The row that shows lives, the clock and messages */
    #hud {
      font-size: 18px;
      margin-top: 4px;
    }

    #message {
      font-weight: bold;
      color: #B00020;
    }

    /* The buttons for picking your character */
    .emoji-button {
      font-size: 24px;
      padding: 2px 8px;
      margin: 2px;
      cursor: pointer;
      border: 2px solid gray;
      border-radius: 8px;
      background: white;
    }

    /* The buttons for picking a block type */
    .block-button {
      width: 36px;
      height: 36px;
      margin: 2px;
      cursor: pointer;
      border: 2px solid gray;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      text-shadow: 0 0 3px black;
    }

    /* The button you picked glows orange */
    .picked {
      border: 3px solid orange;
      box-shadow: 0 0 6px orange;
    }

    #restart-btn {
      display: none;      /* hidden until the game ends */
      font-size: 18px;
      padding: 4px 14px;
      margin-left: 10px;
      cursor: pointer;
      border: 2px solid #B00020;
      border-radius: 8px;
      background: #FFD54F;
      font-weight: bold;
    }

    /* The game world */
    canvas {
      display: block;
      background: white;
      cursor: pointer;
      touch-action: none;   /* fingers control the game, not the page */
    }

    /* The on-screen arrow pad (great for tablets and phones) */
    #dpad {
      position: fixed;
      right: 15px;
      bottom: 15px;
      display: grid;
      grid-template-columns: 52px 52px 52px;
      grid-template-rows: 52px 52px 52px;
      gap: 4px;
      opacity: 0.85;
    }

    #dpad button {
      font-size: 26px;
      border: 2px solid #555;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      touch-action: manipulation;   /* no double-tap zoom on the buttons */
      user-select: none;
    }

    /* the build toggle glows orange when it's on */
    #pad-build.picked {
      border: 3px solid orange;
      box-shadow: 0 0 6px orange;
      background: #FFF3C4;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <b>Zombie Defense</b> &mdash;
    drag or arrows = walk &nbsp;|&nbsp; B + arrow (or 🧱 + pad) = build or break &nbsp;|&nbsp; 1 to 0 = pick a block &nbsp;|&nbsp; tap a zombie to bop it!
    <br>
    Character:
    <button class="emoji-button picked">🙂</button>
    <button class="emoji-button">🐱</button>
    <button class="emoji-button">🤖</button>
    <button class="emoji-button">🦄</button>
    <button class="emoji-button">🐸</button>
    <button class="emoji-button">🌟</button>
    &nbsp; Blocks:
    <span id="hotbar"></span>
    <div id="hud">
      Lives: <span id="lives"></span> &nbsp;|&nbsp;
      Time left: <span id="clock">5:00</span> &nbsp;|&nbsp;
      Zombies: <span id="zombie-count">0</span>
      <span id="message"></span>
      <button id="restart-btn">Play again!</button>
    </div>
  </div>

  <canvas id="game"></canvas>

  <!-- on-screen arrows, laid out like a plus sign -->
  <div id="dpad">
    <span></span>
    <button id="pad-up">⬆️</button>
    <span></span>
    <button id="pad-left">⬅️</button>
    <button id="pad-build" title="Build mode">🧱</button>
    <button id="pad-right">➡️</button>
    <span></span>
    <button id="pad-down">⬇️</button>
    <span></span>
  </div>

  <script>
    // ----- SETTINGS -----
    const SIZE = 40;              // each square is 40 pixels big
    const START_LIVES = 5;        // how many lives you start with
    const GAME_SECONDS = 5 * 60;  // survive this long to win (5 minutes)
    const FIRST_SPAWN = 30;       // seconds until the first zombie (roughly)
    const ZOMBIE_STEP_MS = 600;   // zombies take a step this often
    const ZOMBIE_LIVES = 3;       // how many bops it takes to pop a zombie
    const BLOCK_STRENGTH = 10;    // how many zombie bumps a block survives
    const LAVA = 6;               // which block number is Lava (it's special!)
    const SLIDE_SPEED = 0.25;     // how fast everyone glides between squares (0 to 1)
    let COLS = 0;                 // how many squares across
    let ROWS = 0;                 // how many squares up

    // ----- THE BLOCK TYPES -----
    const BLOCK_TYPES = [
      { name: "Dirt",  color: "#8B5A2B" },
      { name: "Grass", color: "#4CAF50" },
      { name: "Stone", color: "#9E9E9E" },
      { name: "Wood",  color: "#DEB887" },
      { name: "Sand",  color: "#F0E68C" },
      { name: "Water", color: "#4FC3F7" },
      { name: "Lava",  color: "#FF5722" },
      { name: "Rose",  color: "#E91E63" },
      { name: "Snow",  color: "#FFFFFF" },
      { name: "Coal",  color: "#37474F" }
    ];
    let currentBlock = 0;

    // ----- THE WORLD -----
    // IMPORTANT: in this game y = 0 is the BOTTOM row, and y counts UP.
    // That way, when you zoom out with Ctrl+Minus, new squares appear
    // at the TOP and the RIGHT - the ground stays put!
    // Everyone has a real spot (x, y) on the grid, and a drawing spot
    // (drawX, drawY) that glides smoothly towards it every frame.
    let player = { x: 7, y: 0, drawX: 7, drawY: 0, emoji: "🙂" };
    let blocks = new Map();       // spot like "3,4" -> block type number
    let blockDamage = new Map();  // spot -> how many times zombies bumped it
    let zombies = [];             // each zombie is { x, y, drawX, drawY, lives }

    // ----- THE GAME STATE -----
    let state = "playing";        // "playing", "won" or "lost"
    let lives = START_LIVES;
    let secondsLeft = GAME_SECONDS;
    let spawnDelay = FIRST_SPAWN; // seconds between zombies (shrinks over time)
    let spawnTimer = null;

    // ----- DRAWING -----
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // turn a world row (counted from the bottom) into screen pixels
    function screenY(y) {
      return canvas.height - (y + 1) * SIZE;
    }

    function draw() {
      // wipe the screen clean
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // draw the grid lines (starting from the bottom!)
      ctx.strokeStyle = "#ddd";
      for (let col = 0; col <= COLS; col++) {
        ctx.beginPath();
        ctx.moveTo(col * SIZE, canvas.height - ROWS * SIZE);
        ctx.lineTo(col * SIZE, canvas.height);
        ctx.stroke();
      }
      for (let row = 0; row <= ROWS; row++) {
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - row * SIZE);
        ctx.lineTo(COLS * SIZE, canvas.height - row * SIZE);
        ctx.stroke();
      }

      // draw every block in its own color
      for (let [spot, blockType] of blocks) {
        let [x, y] = spot.split(",").map(Number);
        const type = BLOCK_TYPES[blockType];
        if (!type) continue;
        ctx.fillStyle = type.color;
        ctx.fillRect(x * SIZE + 1, screenY(y) + 1, SIZE - 2, SIZE - 2);
        ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
        ctx.strokeRect(x * SIZE + 1, screenY(y) + 1, SIZE - 2, SIZE - 2);

        // show cracks if zombies have been bumping this block
        const damage = blockDamage.get(spot) || 0;
        if (damage > 0) drawCracks(x, y, damage);
      }

      // draw everyone (at their smooth gliding spots!)
      ctx.font = "32px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (let z of zombies) {
        ctx.fillText("🧟", z.drawX * SIZE + SIZE / 2, screenY(z.drawY) + SIZE / 2);
        // little green hearts show the zombie's lives
        ctx.font = "9px serif";
        ctx.fillText("💚".repeat(z.lives), z.drawX * SIZE + SIZE / 2, screenY(z.drawY) + 5);
        ctx.font = "32px serif";
      }
      ctx.fillText(player.emoji, player.drawX * SIZE + SIZE / 2, screenY(player.drawY) + SIZE / 2);

      // if the game is over, say so in big letters
      if (state === "lost") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#FF5252";
        ctx.font = "bold 70px sans-serif";
        ctx.fillText("💀 GAME OVER 💀", canvas.width / 2, canvas.height / 2);
      }
    }

    // ----- CRACKS ON DAMAGED BLOCKS -----
    function drawCracks(x, y, damage) {
      const midX = x * SIZE + SIZE / 2;
      const midY = screenY(y) + SIZE / 2;

      // the more damage, the darker the block gets
      ctx.fillStyle = "rgba(0, 0, 0, " + (damage / BLOCK_STRENGTH) * 0.4 + ")";
      ctx.fillRect(x * SIZE + 1, screenY(y) + 1, SIZE - 2, SIZE - 2);

      // cracks spread out from the middle, one per bump
      ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
      ctx.beginPath();
      for (let i = 0; i < damage; i++) {
        const angle = i * 2.4;    // spins each new crack to a new direction
        ctx.moveTo(midX, midY);
        ctx.lineTo(midX + Math.cos(angle) * SIZE * 0.45,
                   midY + Math.sin(angle) * SIZE * 0.45);
      }
      ctx.stroke();
    }

    // ----- SMOOTH GLIDING -----
    // every frame, drawing spots slide a little closer to the real spots
    function slide(current, target) {
      const diff = target - current;
      if (Math.abs(diff) < 0.01) return target;   // close enough - snap on
      return current + diff * SLIDE_SPEED;
    }

    function gameFrame() {
      player.drawX = slide(player.drawX, player.x);
      player.drawY = slide(player.drawY, player.y);
      for (let z of zombies) {
        z.drawX = slide(z.drawX, z.x);
        z.drawY = slide(z.drawY, z.y);
      }

      draw();
      if (state === "won") drawCelebration();

      requestAnimationFrame(gameFrame);   // and again next frame, forever
    }

    // ----- FILLING THE WHOLE WINDOW -----
    function fillWindow() {
      const topBar = document.getElementById("top-bar");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - topBar.offsetHeight;
      COLS = Math.floor(canvas.width / SIZE);
      ROWS = Math.floor(canvas.height / SIZE);

      // if the window shrank, keep the player inside the world
      if (player.x >= COLS) player.x = COLS - 1;
      if (player.y >= ROWS) player.y = ROWS - 1;

      draw();
    }
    window.addEventListener("resize", fillWindow);

    // ----- HELPERS -----
    function hasZombieAt(x, y) {
      for (let z of zombies) {
        if (z.x === x && z.y === y) return true;
      }
      return false;
    }

    function setMessage(text) {
      document.getElementById("message").textContent = text;
    }

    function updateHud() {
      document.getElementById("lives").textContent = "❤️".repeat(lives) + "🖤".repeat(START_LIVES - lives);
      document.getElementById("zombie-count").textContent = zombies.length;
      const minutes = Math.floor(secondsLeft / 60);
      const seconds = secondsLeft % 60;
      document.getElementById("clock").textContent = minutes + ":" + String(seconds).padStart(2, "0");
    }

    // ----- BUILDING OR BREAKING ONE SPOT -----
    function buildOrBreak(spot) {
      if (blocks.has(spot)) {
        blocks.delete(spot);      // already a block there? break it
      } else {
        blocks.set(spot, currentBlock);
      }
      blockDamage.delete(spot);   // new or gone - either way, no cracks
    }

    // ----- ZOMBIES -----
    function spawnZombie() {
      // try a few random columns along the TOP row until we find a free one
      for (let tries = 0; tries < 20; tries++) {
        const x = Math.floor(Math.random() * COLS);
        const y = ROWS - 1;
        if (blocks.has(x + "," + y) || hasZombieAt(x, y)) continue;
        // drawY starts one row higher, so new zombies slide down into view
        zombies.push({ x: x, y: y, drawX: x, drawY: y + 1, lives: ZOMBIE_LIVES });
        return;
      }
    }

    function spawnWave() {
      // each wave DOUBLES the zombies: 1, then 2, then 4, then 8...
      const howMany = Math.max(1, zombies.length);
      for (let i = 0; i < howMany; i++) spawnZombie();
      updateHud();
      checkIfCaught();
    }

    function scheduleNextZombie() {
      // wait about spawnDelay seconds, but wobble it by up to 20%
      const wobble = 0.8 + Math.random() * 0.4;
      spawnTimer = setTimeout(function () {
        if (state !== "playing") return;
        spawnWave();
        spawnDelay = Math.max(5, spawnDelay - 1);   // each wave comes a second sooner
        scheduleNextZombie();
      }, spawnDelay * wobble * 1000);
    }

    function moveOneZombie(z) {
      // the four ways a zombie can shamble
      const choices = [
        { dx: 1,  dy: 0,  weight: 1 },
        { dx: -1, dy: 0,  weight: 1 },
        { dx: 0,  dy: 1,  weight: 1 },
        { dx: 0,  dy: -1, weight: 1 }
      ];

      for (let c of choices) {
        // zombies like moving towards the player...
        if (c.dx !== 0 && c.dx === Math.sign(player.x - z.x)) c.weight += 2;
        if (c.dy !== 0 && c.dy === Math.sign(player.y - z.y)) c.weight += 2;
        // ...and they drift down a little
        if (c.dy === -1) c.weight += 0.5;
      }

      // pick one choice at random, but heavier weights win more often
      let total = 0;
      for (let c of choices) total += c.weight;
      let pick = Math.random() * total;
      let chosen = choices[0];
      for (let c of choices) {
        pick = pick - c.weight;
        if (pick <= 0) { chosen = c; break; }
      }

      const newX = z.x + chosen.dx;
      const newY = z.y + chosen.dy;
      const spot = newX + "," + newY;

      // zombies stay in the world
      if (newX < 0 || newX >= COLS || newY < 0 || newY >= ROWS) return;

      // EVERY block stops them - but blocks pay a price...
      if (blocks.has(spot)) {
        if (blocks.get(spot) === LAVA) {
          z.lives = 0;            // sizzle! lava melts zombies instantly
          return;                 // (and lava itself is never damaged)
        }
        // the zombie bumps the block and cracks it a little
        const damage = (blockDamage.get(spot) || 0) + 1;
        if (damage >= BLOCK_STRENGTH) {
          blocks.delete(spot);    // too many bumps - the block breaks!
          blockDamage.delete(spot);
        } else {
          blockDamage.set(spot, damage);
        }
        return;
      }

      if (hasZombieAt(newX, newY)) return;

      z.x = newX;
      z.y = newY;
    }

    function moveAllZombies() {
      if (state !== "playing") return;
      for (let z of zombies) moveOneZombie(z);
      // carry away the zombies that melted in lava
      zombies = zombies.filter(function (z) { return z.lives > 0; });
      checkIfCaught();
      updateHud();
    }

    // ----- GETTING CAUGHT -----
    function checkIfCaught() {
      if (state !== "playing") return;
      if (!hasZombieAt(player.x, player.y)) return;

      lives = lives - 1;
      updateHud();

      if (lives <= 0) {
        gameLost();
      } else {
        setMessage("A zombie got you! 😱");
        setTimeout(function () { if (state === "playing") setMessage(""); }, 2000);
        respawnPlayer();
      }
    }

    function respawnPlayer() {
      // pop up somewhere empty
      for (let tries = 0; tries < 200; tries++) {
        const x = Math.floor(Math.random() * COLS);
        const y = Math.floor(Math.random() * ROWS);
        if (blocks.has(x + "," + y) || hasZombieAt(x, y)) continue;
        player.x = x;
        player.y = y;
        // respawning teleports - no sliding across the whole screen
        player.drawX = x;
        player.drawY = y;
        return;
      }
    }

    // ----- WINNING AND LOSING -----
    function gameLost() {
      state = "lost";
      clearTimeout(spawnTimer);
      setMessage("The zombies won this time...");
      document.getElementById("restart-btn").style.display = "inline-block";
    }

    function gameWon() {
      state = "won";
      clearTimeout(spawnTimer);
      setMessage("🎉 YOU SURVIVED! 🎉");
      document.getElementById("restart-btn").style.display = "inline-block";
      explodeStars();
      explodeStars();
    }

    function restartGame() {
      // a fresh empty world each round - build your fort again!
      blocks.clear();
      blockDamage.clear();
      zombies = [];
      lives = START_LIVES;
      secondsLeft = GAME_SECONDS;
      spawnDelay = FIRST_SPAWN;
      state = "playing";
      stars = [];
      player.x = Math.min(7, COLS - 1);
      player.y = 0;
      player.drawX = player.x;
      player.drawY = player.y;
      setMessage("");
      document.getElementById("restart-btn").style.display = "none";
      updateHud();
      scheduleNextZombie();
    }
    document.getElementById("restart-btn").addEventListener("click", restartGame);

    // ----- THE CELEBRATION (exploding stars!) -----
    let stars = [];
    const STAR_COLORS = ["#FFD700", "#FF5252", "#40C4FF", "#69F0AE", "#E040FB", "#FFAB40"];

    function explodeStars() {
      // one big burst at a random spot
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height * 0.7;
      const color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
      for (let i = 0; i < 35; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        stars.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 50 + Math.random() * 40,
          color: color,
          isEmoji: Math.random() < 0.15    // some sparks are real star emoji!
        });
      }
    }

    function drawCelebration() {
      // sometimes add a new explosion
      if (Math.random() < 0.06) explodeStars();

      // move and draw every star
      for (let s of stars) {
        s.x = s.x + s.vx;
        s.y = s.y + s.vy;
        s.vy = s.vy + 0.05;       // a little gravity
        s.life = s.life - 1;

        if (s.isEmoji) {
          ctx.font = "22px serif";
          ctx.fillText("⭐", s.x, s.y);
        } else {
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // throw away stars that burned out
      stars = stars.filter(function (s) { return s.life > 0; });

      // the big winning words
      ctx.fillStyle = "#FFD700";
      ctx.strokeStyle = "black";
      ctx.lineWidth = 3;
      ctx.font = "bold 70px sans-serif";
      ctx.textAlign = "center";
      ctx.strokeText("🎉 YOU WIN! 🎉", canvas.width / 2, canvas.height / 2);
      ctx.fillText("🎉 YOU WIN! 🎉", canvas.width / 2, canvas.height / 2);
    }

    // ----- THE CLOCK -----
    setInterval(function () {
      if (state !== "playing") return;
      secondsLeft = secondsLeft - 1;
      updateHud();
      if (secondsLeft <= 0) gameWon();
    }, 1000);

    // ----- ONE MOVE (shared by keyboard, drag and the arrow pad) -----
    // dx/dy point at the square next to the player.
    // build = true means build/break there instead of walking.
    function doAction(dx, dy, build) {
      if (state !== "playing") return;

      const newX = player.x + dx;
      const newY = player.y + dy;

      // stay inside the world
      if (newX < 0 || newX >= COLS || newY < 0 || newY >= ROWS) return;

      const spot = newX + "," + newY;

      if (build) {
        buildOrBreak(spot);
      } else {
        // walk (but not through blocks - even lava
        // never hurts the player, it only blocks the way)
        if (blocks.has(spot)) return;
        player.x = newX;
        player.y = newY;
        checkIfCaught();     // walking into a zombie hurts too!
      }
    }

    // ----- KEYBOARD -----
    let bHeld = false;            // is the B key held down right now?

    document.addEventListener("keydown", function (event) {
      const key = event.key;

      if (key === "b" || key === "B") bHeld = true;

      // number keys 1-9 and 0 pick a block type
      const numbers = "1234567890";
      if (numbers.includes(key)) pickBlock(numbers.indexOf(key));

      // which way is the arrow pointing?
      // remember: y counts UP from the bottom, so ArrowUp means y + 1
      let dx = 0;
      let dy = 0;
      if (key === "ArrowUp")    dy = 1;
      if (key === "ArrowDown")  dy = -1;
      if (key === "ArrowLeft")  dx = -1;
      if (key === "ArrowRight") dx = 1;
      if (dx === 0 && dy === 0) return;   // not an arrow key

      event.preventDefault();             // stop the page from scrolling
      doAction(dx, dy, bHeld);
    });

    document.addEventListener("keyup", function (event) {
      if (event.key === "b" || event.key === "B") bHeld = false;
    });

    // ----- THE ARROW PAD (for tablets and phones) -----
    let padBuild = false;         // is the 🧱 build toggle switched on?

    document.getElementById("pad-build").addEventListener("click", function () {
      padBuild = !padBuild;
      this.classList.toggle("picked", padBuild);
    });

    function wirePadButton(id, dx, dy) {
      document.getElementById(id).addEventListener("pointerdown", function (event) {
        event.preventDefault();   // taps shouldn't zoom or select text
        doAction(dx, dy, padBuild);
      });
    }
    wirePadButton("pad-up", 0, 1);
    wirePadButton("pad-down", 0, -1);
    wirePadButton("pad-left", -1, 0);
    wirePadButton("pad-right", 1, 0);

    // ----- CLICKING AND DRAGGING -----
    // which square is the mouse or finger on?
    function cellFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: Math.floor((event.clientX - rect.left) / SIZE),
        y: Math.floor((canvas.height - (event.clientY - rect.top)) / SIZE)
      };
    }

    // grab the player and pull them around!
    let dragging = false;
    let justDragged = false;      // so letting go doesn't also build a block

    canvas.addEventListener("pointerdown", function (event) {
      const cell = cellFromEvent(event);
      if (cell.x === player.x && cell.y === player.y) {
        dragging = true;
        // keep following the finger even if it slips off the canvas
        if (canvas.hasPointerCapture && event.pointerId >= 0) {
          try { canvas.setPointerCapture(event.pointerId); } catch (e) { /* fine without it */ }
        }
      }
    });

    canvas.addEventListener("pointermove", function (event) {
      if (!dragging || state !== "playing") return;
      const cell = cellFromEvent(event);
      stepTowards(cell.x, cell.y);
    });

    canvas.addEventListener("pointerup", function () {
      if (!dragging) return;
      dragging = false;
      justDragged = true;
      setTimeout(function () { justDragged = false; }, 150);
    });

    // take ONE step towards where the finger is - walls still count!
    function stepTowards(tx, ty) {
      if (tx === player.x && ty === player.y) return;
      const dx = Math.sign(tx - player.x);
      const dy = Math.sign(ty - player.y);

      // try the longer direction first, then the other one
      let tryOrder;
      if (Math.abs(tx - player.x) >= Math.abs(ty - player.y)) {
        tryOrder = [[dx, 0], [0, dy]];
      } else {
        tryOrder = [[0, dy], [dx, 0]];
      }

      for (let [mx, my] of tryOrder) {
        if (mx === 0 && my === 0) continue;
        const nx = player.x + mx;
        const ny = player.y + my;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        if (blocks.has(nx + "," + ny)) continue;
        player.x = nx;
        player.y = ny;
        checkIfCaught();
        return;
      }
    }

    canvas.addEventListener("click", function (event) {
      if (state !== "playing") return;
      if (justDragged) return;    // that click was the end of a drag

      const cell = cellFromEvent(event);
      const x = cell.x;
      const y = cell.y;

      // ignore clicks outside the world or on the player
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
      if (x === player.x && y === player.y) return;

      // did we click a zombie? bop it!
      for (let z of zombies) {
        if (z.x === x && z.y === y) {
          z.lives = z.lives - 1;
          if (z.lives <= 0) {
            zombies = zombies.filter(function (other) { return other.lives > 0; });
            setMessage("Zombie bopped! 💥");
            setTimeout(function () { if (state === "playing") setMessage(""); }, 1500);
          }
          updateHud();
          return;            // clicking a zombie never builds a block
        }
      }

      buildOrBreak(x + "," + y);
    });

    // ----- PICKING YOUR CHARACTER -----
    for (let button of document.querySelectorAll(".emoji-button")) {
      button.addEventListener("click", function () {
        document.querySelector(".emoji-button.picked").classList.remove("picked");
        button.classList.add("picked");
        player.emoji = button.textContent;
      });
    }

    // ----- PICKING A BLOCK TYPE -----
    const hotbar = document.getElementById("hotbar");
    for (let i = 0; i < BLOCK_TYPES.length; i++) {
      const button = document.createElement("button");
      button.className = "block-button";
      button.style.background = BLOCK_TYPES[i].color;
      button.textContent = (i + 1) % 10;   // show the key: 1, 2, ... 9, 0
      button.title = BLOCK_TYPES[i].name;
      button.addEventListener("click", function () { pickBlock(i); });
      hotbar.appendChild(button);
    }

    function pickBlock(i) {
      currentBlock = i;
      const buttons = document.querySelectorAll(".block-button");
      for (let j = 0; j < buttons.length; j++) {
        if (j === i) {
          buttons[j].classList.add("picked");
        } else {
          buttons[j].classList.remove("picked");
        }
      }
    }

    // ----- ZOMBIE HEARTBEAT -----
    setInterval(moveAllZombies, ZOMBIE_STEP_MS);

    // get everything ready!
    pickBlock(0);
    updateHud();
    fillWindow();
    scheduleNextZombie();
    gameFrame();              // start the smooth drawing loop
  </script>

</body>
</html>
