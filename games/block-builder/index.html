<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Block Game</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;    /* no scrollbars - the game fills the window */
      font-family: sans-serif;
      background: #87CEEB; /* sky blue */
    }

    /* The bar across the top of the screen */
    #top-bar {
      text-align: center;
      padding: 5px;
    }

    .save-controls {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      font-size: 14px;
    }

    .save-controls input {
      width: 120px;
      padding: 4px 6px;
      border: 1px solid #999;
      border-radius: 6px;
    }

    .save-controls button {
      padding: 4px 8px;
      border: 1px solid #777;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }

    #save-status {
      min-width: 140px;
      text-align: left;
      color: #333;
      font-size: 12px;
    }

    #autosave-time {
      min-width: 140px;
      text-align: left;
      color: #333;
      font-size: 12px;
    }

    /* The buttons for picking your character */
    .emoji-button {
      font-size: 24px;
      padding: 2px 8px;
      margin: 2px;
      cursor: pointer;
      border: 2px solid gray;
      border-radius: 8px;
      background: white;
    }

    /* The buttons for picking a block type */
    .block-button {
      width: 36px;
      height: 36px;
      margin: 2px;
      cursor: pointer;
      border: 2px solid gray;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      text-shadow: 0 0 3px black;
    }

    /* The button you picked glows orange */
    .picked {
      border: 3px solid orange;
      box-shadow: 0 0 6px orange;
    }

    /* The game world */
    canvas {
      display: block;
      background: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <b>My Block Game</b> &mdash;
    arrows = walk &nbsp;|&nbsp; B + arrow = build or break &nbsp;|&nbsp; 1 to 0 = pick a block &nbsp;|&nbsp; click works too
    <br>
    Character:
    <button class="emoji-button picked">🙂</button>
    <button class="emoji-button">🐱</button>
    <button class="emoji-button">🤖</button>
    <button class="emoji-button">🦄</button>
    <button class="emoji-button">🧟</button>
    <button class="emoji-button">🐸</button>
    <button class="emoji-button">🌟</button>
    &nbsp; Blocks:
    <span id="hotbar"></span>
    <div class="save-controls">
      Slots:
      <select id="slot-list" aria-label="Saved slots"></select>
      Save slot:
      <input id="save-slot" type="text" value="main" maxlength="30" aria-label="Save slot name">
      <button id="save-btn" type="button">Save</button>
      <button id="load-btn" type="button">Load</button>
      <button id="clear-btn" type="button">Clear Slot</button>
      <button id="export-btn" type="button">Export JSON</button>
      <button id="import-btn" type="button">Import JSON</button>
      <input id="import-file" type="file" accept="application/json" style="display:none">
      <span id="save-status"></span>
      <span id="autosave-time">Last auto-save: never</span>
    </div>
  </div>

  <canvas id="game"></canvas>

  <script>
    // ----- SETTINGS -----
    const SIZE = 40;              // each square is 40 pixels big
    let COLS = 0;                 // how many squares across (set when we measure the window)
    let ROWS = 0;                 // how many squares down

    // ----- THE BLOCK TYPES -----
    // Press keys 1 to 0 (or click a button) to pick one
    const BLOCK_TYPES = [
      { name: "Dirt",  color: "#8B5A2B" },
      { name: "Grass", color: "#4CAF50" },
      { name: "Stone", color: "#9E9E9E" },
      { name: "Wood",  color: "#DEB887" },
      { name: "Sand",  color: "#F0E68C" },
      { name: "Water", color: "#4FC3F7" },
      { name: "Lava",  color: "#FF5722" },
      { name: "Rose",  color: "#E91E63" },
      { name: "Snow",  color: "#FFFFFF" },
      { name: "Coal",  color: "#37474F" }
    ];
    let currentBlock = 0;         // which block type is picked (starts on Dirt)

    // ----- THE PLAYER -----
    let player = {
      x: 7,                       // which column the player is in
      y: 5,                       // which row the player is in
      emoji: "🙂"                 // what the player looks like
    };

    // ----- THE BLOCKS -----
    // We remember each block by its spot, like "3,4", and block type index
    let blocks = new Map();

    const SAVE_VERSION = 2;
    const STORAGE_PREFIX = "my-block-game-save:";
    const slotList = document.getElementById("slot-list");
    const saveSlotInput = document.getElementById("save-slot");
    const saveStatus = document.getElementById("save-status");
    const autoSaveTime = document.getElementById("autosave-time");
    const importFileInput = document.getElementById("import-file");
    let lastAutoSaveMs = null;

    // ----- DRAWING -----
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function draw() {
      // wipe the screen clean
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // draw the grid lines
      ctx.strokeStyle = "#ddd";
      for (let col = 0; col <= COLS; col++) {
        ctx.beginPath();
        ctx.moveTo(col * SIZE, 0);
        ctx.lineTo(col * SIZE, ROWS * SIZE);
        ctx.stroke();
      }
      for (let row = 0; row <= ROWS; row++) {
        ctx.beginPath();
        ctx.moveTo(0, row * SIZE);
        ctx.lineTo(COLS * SIZE, row * SIZE);
        ctx.stroke();
      }

      // draw every block in its own color
      for (let [spot, blockType] of blocks) {
        let [x, y] = spot.split(",").map(Number);
        const type = BLOCK_TYPES[blockType];
        if (!type) continue;
        ctx.fillStyle = type.color;
        ctx.fillRect(x * SIZE + 1, y * SIZE + 1, SIZE - 2, SIZE - 2);
        ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";   // thin outline so snow shows up
        ctx.strokeRect(x * SIZE + 1, y * SIZE + 1, SIZE - 2, SIZE - 2);
      }

      // draw the player
      ctx.font = "32px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(player.emoji, player.x * SIZE + SIZE / 2, player.y * SIZE + SIZE / 2);
    }

    // ----- FILLING THE WHOLE WINDOW -----
    function fillWindow() {
      const topBar = document.getElementById("top-bar");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - topBar.offsetHeight;
      COLS = Math.floor(canvas.width / SIZE);
      ROWS = Math.floor(canvas.height / SIZE);

      // if the window shrank, keep the player inside the world
      if (player.x >= COLS) player.x = COLS - 1;
      if (player.y >= ROWS) player.y = ROWS - 1;

      draw();
    }
    window.addEventListener("resize", fillWindow);

    // ----- BUILDING OR BREAKING ONE SPOT -----
    function buildOrBreak(spot) {
      if (blocks.has(spot)) {
        blocks.delete(spot);      // already a block there? break it
      } else {
        blocks.set(spot, currentBlock);
      }
      autoSaveToCurrentSlot();
    }

    function currentSlotName() {
      return (saveSlotInput.value || "main").trim() || "main";
    }

    function storageKeyForSlot(slot) {
      return STORAGE_PREFIX + slot;
    }

    function slotsFromStorage() {
      const slots = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith(STORAGE_PREFIX)) continue;
        const slot = key.slice(STORAGE_PREFIX.length);
        if (slot) slots.push(slot);
      }
      slots.sort();
      return slots;
    }

    function refreshSlotList() {
      const current = currentSlotName();
      const slots = slotsFromStorage();
      if (!slots.includes(current)) slots.unshift(current);

      slotList.innerHTML = "";
      for (const slot of slots) {
        const option = document.createElement("option");
        option.value = slot;
        option.textContent = slot;
        slotList.appendChild(option);
      }
      slotList.value = current;
    }

    function setStatus(message) {
      saveStatus.textContent = message;
    }

    function formatElapsed(ms) {
      const seconds = Math.max(0, Math.floor(ms / 1000));
      if (seconds < 60) return seconds + "s ago";
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + "m ago";
      const hours = Math.floor(minutes / 60);
      return hours + "h ago";
    }

    function updateAutoSaveLabel() {
      if (lastAutoSaveMs === null) {
        autoSaveTime.textContent = "Last auto-save: never";
        return;
      }
      autoSaveTime.textContent = "Last auto-save: " + formatElapsed(Date.now() - lastAutoSaveMs);
    }

    function markAutoSaveTime(savedAtIso) {
      const stamp = savedAtIso ? Date.parse(savedAtIso) : Date.now();
      lastAutoSaveMs = Number.isNaN(stamp) ? Date.now() : stamp;
      updateAutoSaveLabel();
    }

    function serializeGameState() {
      return {
        version: SAVE_VERSION,
        savedAt: new Date().toISOString(),
        currentBlock,
        player: {
          x: player.x,
          y: player.y,
          emoji: player.emoji
        },
        blocks: Array.from(blocks.entries()).map(function ([spot, type]) {
          const [x, y] = spot.split(",").map(Number);
          return { x, y, type };
        })
      };
    }

    function colorToTypeIndex(color) {
      const normalized = String(color || "").toLowerCase();
      for (let i = 0; i < BLOCK_TYPES.length; i++) {
        if (BLOCK_TYPES[i].color.toLowerCase() === normalized) return i;
      }
      return 0;
    }

    function migrateSaveData(data) {
      if (!data || typeof data !== "object") {
        throw new Error("Save file format is invalid.");
      }

      let next = data;
      let version = Number.isInteger(next.version) ? next.version : 0;

      if (version === 0) {
        const migratedBlocks = [];
        if (Array.isArray(next.blocks)) {
          for (const item of next.blocks) {
            if (!item) continue;
            const x = Number(item.x);
            const y = Number(item.y);
            const type = Number(item.type);
            if (Number.isInteger(x) && Number.isInteger(y) && Number.isInteger(type)) {
              migratedBlocks.push({ x, y, type });
            }
          }
        } else if (next.blocks && typeof next.blocks === "object") {
          for (const [spot, color] of Object.entries(next.blocks)) {
            const parts = spot.split(",");
            if (parts.length !== 2) continue;
            const x = Number(parts[0]);
            const y = Number(parts[1]);
            if (!Number.isInteger(x) || !Number.isInteger(y)) continue;
            migratedBlocks.push({ x, y, type: colorToTypeIndex(color) });
          }
        }

        next = {
          version: 1,
          savedAt: next.savedAt || new Date().toISOString(),
          currentBlock: Number.isInteger(next.currentBlock) ? next.currentBlock : 0,
          player: {
            x: next.player && Number.isInteger(next.player.x) ? next.player.x : 0,
            y: next.player && Number.isInteger(next.player.y) ? next.player.y : 0,
            emoji: next.player && next.player.emoji ? String(next.player.emoji) : "🙂"
          },
          blocks: migratedBlocks
        };
        version = 1;
      }

      if (version === 1) {
        next = {
          version: 2,
          savedAt: next.savedAt || new Date().toISOString(),
          currentBlock: next.currentBlock,
          player: next.player,
          blocks: next.blocks,
          meta: {
            migratedFrom: 1,
            migratedAt: new Date().toISOString()
          }
        };
        version = 2;
      }

      if (version > SAVE_VERSION) {
        throw new Error("Save file was created by a newer game version.");
      }

      return next;
    }

    function applyGameState(data) {
      const safeData = migrateSaveData(data);

      if (!safeData || !safeData.player || !Array.isArray(safeData.blocks)) {
        throw new Error("Save file format is invalid.");
      }

      blocks = new Map();
      for (const item of safeData.blocks) {
        if (!item) continue;
        const x = Number(item.x);
        const y = Number(item.y);
        const type = Number(item.type);
        if (!Number.isInteger(x) || !Number.isInteger(y)) continue;
        if (!Number.isInteger(type) || type < 0 || type >= BLOCK_TYPES.length) continue;
        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) continue;
        blocks.set(x + "," + y, type);
      }

      player.x = Math.max(0, Math.min(COLS - 1, Number(safeData.player.x) || 0));
      player.y = Math.max(0, Math.min(ROWS - 1, Number(safeData.player.y) || 0));
      player.emoji = String(safeData.player.emoji || "🙂");

      const nextBlock = Number(safeData.currentBlock);
      pickBlock(Number.isInteger(nextBlock) && nextBlock >= 0 && nextBlock < BLOCK_TYPES.length ? nextBlock : 0);
      updateCharacterButtons();
      markAutoSaveTime(safeData.savedAt);
      draw();
    }

    function saveToSlot(slot, options = {}) {
      const state = serializeGameState();
      localStorage.setItem(storageKeyForSlot(slot), JSON.stringify(state));
      if (!options.silent) setStatus("Saved to slot: " + slot);
      if (options.auto) markAutoSaveTime(state.savedAt);
      refreshSlotList();
    }

    function loadFromSlot(slot) {
      const raw = localStorage.getItem(storageKeyForSlot(slot));
      if (!raw) {
        setStatus("No save in slot: " + slot);
        return false;
      }
      applyGameState(JSON.parse(raw));
      setStatus("Loaded slot: " + slot);
      return true;
    }

    function clearSlot(slot) {
      localStorage.removeItem(storageKeyForSlot(slot));
      setStatus("Cleared slot: " + slot);
      refreshSlotList();
    }

    function autoSaveToCurrentSlot() {
      try {
        saveToSlot(currentSlotName(), { silent: true, auto: true });
      } catch (error) {
        setStatus("Auto-save failed");
      }
    }

    function exportSaveAsJson() {
      const slot = currentSlotName();
      const json = JSON.stringify(serializeGameState(), null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "block-game-save-" + slot + ".json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setStatus("Exported JSON for: " + slot);
    }

    function importSaveFromJsonText(text) {
      const parsed = JSON.parse(text);
      applyGameState(parsed);
      saveToSlot(currentSlotName(), { auto: true });
      setStatus("Imported JSON and saved.");
    }

    // ----- KEYBOARD -----
    let bHeld = false;            // is the B key held down right now?

    document.addEventListener("keydown", function (event) {
      const key = event.key;

      if (key === "b" || key === "B") bHeld = true;

      // number keys 1-9 and 0 pick a block type
      const numbers = "1234567890";
      if (numbers.includes(key)) pickBlock(numbers.indexOf(key));

      // which way is the arrow pointing?
      let dx = 0;
      let dy = 0;
      if (key === "ArrowUp")    dy = -1;
      if (key === "ArrowDown")  dy = 1;
      if (key === "ArrowLeft")  dx = -1;
      if (key === "ArrowRight") dx = 1;
      if (dx === 0 && dy === 0) return;   // not an arrow key

      event.preventDefault();             // stop the page from scrolling

      const newX = player.x + dx;
      const newY = player.y + dy;

      // stay inside the world
      if (newX < 0 || newX >= COLS || newY < 0 || newY >= ROWS) return;

      const spot = newX + "," + newY;

      if (bHeld) {
        // B + arrow: build (or break) the block next to the player
        buildOrBreak(spot);
      } else {
        // just an arrow: walk (but not through blocks!)
        if (blocks.has(spot)) return;
        player.x = newX;
        player.y = newY;
        autoSaveToCurrentSlot();
      }
      draw();
    });

    document.addEventListener("keyup", function (event) {
      if (event.key === "b" || event.key === "B") bHeld = false;
    });

    // ----- CLICKING -----
    canvas.addEventListener("click", function (event) {
      // figure out which square was clicked
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((event.clientX - rect.left) / SIZE);
      const y = Math.floor((event.clientY - rect.top) / SIZE);

      // ignore clicks outside the world or on the player
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
      if (x === player.x && y === player.y) return;

      buildOrBreak(x + "," + y);
      draw();
    });

    // ----- PICKING YOUR CHARACTER -----
    for (let button of document.querySelectorAll(".emoji-button")) {
      button.addEventListener("click", function () {
        // un-pick the old button, pick this one
        player.emoji = button.textContent;
        updateCharacterButtons();
        autoSaveToCurrentSlot();
        draw();
      });
    }

    function updateCharacterButtons() {
      for (let button of document.querySelectorAll(".emoji-button")) {
        if (button.textContent === player.emoji) {
          button.classList.add("picked");
        } else {
          button.classList.remove("picked");
        }
      }
    }

    // ----- PICKING A BLOCK TYPE -----
    // make one button for each block type
    const hotbar = document.getElementById("hotbar");
    for (let i = 0; i < BLOCK_TYPES.length; i++) {
      const button = document.createElement("button");
      button.className = "block-button";
      button.style.background = BLOCK_TYPES[i].color;
      button.textContent = (i + 1) % 10;   // show the key: 1, 2, ... 9, 0
      button.title = BLOCK_TYPES[i].name;
      button.addEventListener("click", function () { pickBlock(i); });
      hotbar.appendChild(button);
    }

    function pickBlock(i) {
      currentBlock = i;
      const buttons = document.querySelectorAll(".block-button");
      for (let j = 0; j < buttons.length; j++) {
        if (j === i) {
          buttons[j].classList.add("picked");
        } else {
          buttons[j].classList.remove("picked");
        }
      }
    }

    document.getElementById("save-btn").addEventListener("click", function () {
      try {
        saveToSlot(currentSlotName());
      } catch (error) {
        setStatus("Save failed");
      }
    });

    document.getElementById("load-btn").addEventListener("click", function () {
      try {
        loadFromSlot(currentSlotName());
      } catch (error) {
        setStatus("Load failed");
      }
    });

    document.getElementById("clear-btn").addEventListener("click", function () {
      clearSlot(currentSlotName());
    });

    document.getElementById("export-btn").addEventListener("click", function () {
      try {
        exportSaveAsJson();
      } catch (error) {
        setStatus("Export failed");
      }
    });

    document.getElementById("import-btn").addEventListener("click", function () {
      importFileInput.click();
    });

    importFileInput.addEventListener("change", function (event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        try {
          importSaveFromJsonText(String(reader.result || ""));
        } catch (error) {
          setStatus("Import failed");
        }
      };
      reader.readAsText(file);
      importFileInput.value = "";
    });

    saveSlotInput.addEventListener("change", function () {
      refreshSlotList();
      setStatus("Slot set to: " + currentSlotName());
    });

    slotList.addEventListener("change", function () {
      if (!slotList.value) return;
      saveSlotInput.value = slotList.value;
      setStatus("Slot set to: " + currentSlotName());
    });

    window.addEventListener("beforeunload", function () {
      autoSaveToCurrentSlot();
    });

    // get everything ready!
    pickBlock(0);
    refreshSlotList();
    fillWindow();
    loadFromSlot(currentSlotName());
    updateAutoSaveLabel();
    setInterval(updateAutoSaveLabel, 1000);
  </script>

</body>
</html>
