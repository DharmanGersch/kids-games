<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Block Game</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;    /* no scrollbars - the game fills the window */
      font-family: sans-serif;
      background: #87CEEB; /* sky blue */
    }

    /* The bar across the top of the screen */
    #top-bar {
      text-align: center;
      padding: 5px;
    }

    /* The buttons for picking your character */
    .emoji-button {
      font-size: 24px;
      padding: 2px 8px;
      margin: 2px;
      cursor: pointer;
      border: 2px solid gray;
      border-radius: 8px;
      background: white;
    }

    /* The buttons for picking a block type */
    .block-button {
      width: 36px;
      height: 36px;
      margin: 2px;
      cursor: pointer;
      border: 2px solid gray;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      text-shadow: 0 0 3px black;
    }

    /* The button you picked glows orange */
    .picked {
      border: 3px solid orange;
      box-shadow: 0 0 6px orange;
    }

    /* The game world */
    canvas {
      display: block;
      background: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <b>My Block Game</b> &mdash;
    arrows = walk &nbsp;|&nbsp; B + arrow = build or break &nbsp;|&nbsp; 1 to 0 = pick a block &nbsp;|&nbsp; click works too
    <br>
    Character:
    <button class="emoji-button picked">🙂</button>
    <button class="emoji-button">🐱</button>
    <button class="emoji-button">🤖</button>
    <button class="emoji-button">🦄</button>
    <button class="emoji-button">🧟</button>
    <button class="emoji-button">🐸</button>
    <button class="emoji-button">🌟</button>
    &nbsp; Blocks:
    <span id="hotbar"></span>
  </div>

  <canvas id="game"></canvas>

  <script>
    // ----- SETTINGS -----
    const SIZE = 40;              // each square is 40 pixels big
    let COLS = 0;                 // how many squares across (set when we measure the window)
    let ROWS = 0;                 // how many squares down

    // ----- THE BLOCK TYPES -----
    // Press keys 1 to 0 (or click a button) to pick one
    const BLOCK_TYPES = [
      { name: "Dirt",  color: "#8B5A2B" },
      { name: "Grass", color: "#4CAF50" },
      { name: "Stone", color: "#9E9E9E" },
      { name: "Wood",  color: "#DEB887" },
      { name: "Sand",  color: "#F0E68C" },
      { name: "Water", color: "#4FC3F7" },
      { name: "Lava",  color: "#FF5722" },
      { name: "Rose",  color: "#E91E63" },
      { name: "Snow",  color: "#FFFFFF" },
      { name: "Coal",  color: "#37474F" }
    ];
    let currentBlock = 0;         // which block type is picked (starts on Dirt)

    // ----- THE PLAYER -----
    let player = {
      x: 7,                       // which column the player is in
      y: 5,                       // which row the player is in
      emoji: "🙂"                 // what the player looks like
    };

    // ----- THE BLOCKS -----
    // We remember each block by its spot, like "3,4", and its color
    let blocks = new Map();

    // ----- DRAWING -----
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    function draw() {
      // wipe the screen clean
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // draw the grid lines
      ctx.strokeStyle = "#ddd";
      for (let col = 0; col <= COLS; col++) {
        ctx.beginPath();
        ctx.moveTo(col * SIZE, 0);
        ctx.lineTo(col * SIZE, ROWS * SIZE);
        ctx.stroke();
      }
      for (let row = 0; row <= ROWS; row++) {
        ctx.beginPath();
        ctx.moveTo(0, row * SIZE);
        ctx.lineTo(COLS * SIZE, row * SIZE);
        ctx.stroke();
      }

      // draw every block in its own color
      for (let [spot, color] of blocks) {
        let [x, y] = spot.split(",").map(Number);
        ctx.fillStyle = color;
        ctx.fillRect(x * SIZE + 1, y * SIZE + 1, SIZE - 2, SIZE - 2);
        ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";   // thin outline so snow shows up
        ctx.strokeRect(x * SIZE + 1, y * SIZE + 1, SIZE - 2, SIZE - 2);
      }

      // draw the player
      ctx.font = "32px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(player.emoji, player.x * SIZE + SIZE / 2, player.y * SIZE + SIZE / 2);
    }

    // ----- FILLING THE WHOLE WINDOW -----
    function fillWindow() {
      const topBar = document.getElementById("top-bar");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - topBar.offsetHeight;
      COLS = Math.floor(canvas.width / SIZE);
      ROWS = Math.floor(canvas.height / SIZE);

      // if the window shrank, keep the player inside the world
      if (player.x >= COLS) player.x = COLS - 1;
      if (player.y >= ROWS) player.y = ROWS - 1;

      draw();
    }
    window.addEventListener("resize", fillWindow);

    // ----- BUILDING OR BREAKING ONE SPOT -----
    function buildOrBreak(spot) {
      if (blocks.has(spot)) {
        blocks.delete(spot);      // already a block there? break it
      } else {
        blocks.set(spot, BLOCK_TYPES[currentBlock].color);
      }
    }

    // ----- KEYBOARD -----
    let bHeld = false;            // is the B key held down right now?

    document.addEventListener("keydown", function (event) {
      const key = event.key;

      if (key === "b" || key === "B") bHeld = true;

      // number keys 1-9 and 0 pick a block type
      const numbers = "1234567890";
      if (numbers.includes(key)) pickBlock(numbers.indexOf(key));

      // which way is the arrow pointing?
      let dx = 0;
      let dy = 0;
      if (key === "ArrowUp")    dy = -1;
      if (key === "ArrowDown")  dy = 1;
      if (key === "ArrowLeft")  dx = -1;
      if (key === "ArrowRight") dx = 1;
      if (dx === 0 && dy === 0) return;   // not an arrow key

      event.preventDefault();             // stop the page from scrolling

      const newX = player.x + dx;
      const newY = player.y + dy;

      // stay inside the world
      if (newX < 0 || newX >= COLS || newY < 0 || newY >= ROWS) return;

      const spot = newX + "," + newY;

      if (bHeld) {
        // B + arrow: build (or break) the block next to the player
        buildOrBreak(spot);
      } else {
        // just an arrow: walk (but not through blocks!)
        if (blocks.has(spot)) return;
        player.x = newX;
        player.y = newY;
      }
      draw();
    });

    document.addEventListener("keyup", function (event) {
      if (event.key === "b" || event.key === "B") bHeld = false;
    });

    // ----- CLICKING -----
    canvas.addEventListener("click", function (event) {
      // figure out which square was clicked
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((event.clientX - rect.left) / SIZE);
      const y = Math.floor((event.clientY - rect.top) / SIZE);

      // ignore clicks outside the world or on the player
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
      if (x === player.x && y === player.y) return;

      buildOrBreak(x + "," + y);
      draw();
    });

    // ----- PICKING YOUR CHARACTER -----
    for (let button of document.querySelectorAll(".emoji-button")) {
      button.addEventListener("click", function () {
        // un-pick the old button, pick this one
        document.querySelector(".emoji-button.picked").classList.remove("picked");
        button.classList.add("picked");

        player.emoji = button.textContent;
        draw();
      });
    }

    // ----- PICKING A BLOCK TYPE -----
    // make one button for each block type
    const hotbar = document.getElementById("hotbar");
    for (let i = 0; i < BLOCK_TYPES.length; i++) {
      const button = document.createElement("button");
      button.className = "block-button";
      button.style.background = BLOCK_TYPES[i].color;
      button.textContent = (i + 1) % 10;   // show the key: 1, 2, ... 9, 0
      button.title = BLOCK_TYPES[i].name;
      button.addEventListener("click", function () { pickBlock(i); });
      hotbar.appendChild(button);
    }

    function pickBlock(i) {
      currentBlock = i;
      const buttons = document.querySelectorAll(".block-button");
      for (let j = 0; j < buttons.length; j++) {
        if (j === i) {
          buttons[j].classList.add("picked");
        } else {
          buttons[j].classList.remove("picked");
        }
      }
    }

    // get everything ready!
    pickBlock(0);
    fillWindow();
  </script>

</body>
</html>
